<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="eleckoi-author-api" content="0.1.0">
<style>
:root{--bg:#0f1115;--panel:#171a21;--me:#95ec69;--other:#2a2f3a;--text:#e6e8ec;--sub:#8b93a3;--line:#242a35;--accent:#5b8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0;background:transparent;font:14px/1.5 -apple-system,"PingFang SC","Noto Sans SC",sans-serif;color:var(--text)}
.wrap{padding:8px}
.phone{background:var(--bg);border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.tabs{display:flex;gap:0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 14px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:var(--accent);font-weight:600}
.tab .dot{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:5px;border-radius:8px;background:#ff4d4f;color:#fff;font-size:10px;text-align:center;vertical-align:1px}
.pane{display:none;padding:12px}
.pane.on{display:block}
.head{font-size:12px;color:var(--sub);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.ava{flex:0 0 32px;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#4a6cf7,#7b4af7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.body{flex:1;min-width:0}
.name{font-size:11px;color:var(--sub);margin-bottom:3px}
.bubble{display:inline-block;max-width:100%;padding:8px 11px;border-radius:10px;background:var(--other);word-break:break-word;white-space:pre-wrap}
.bubble.voice{display:inline-flex;align-items:center;gap:6px;color:#cfe0ff}
.bubble.voice .dur{font-size:11px;color:var(--sub)}
.redenv{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:linear-gradient(135deg,#e8543f,#f0854a);color:#fff;font-weight:600}
.redenv small{font-weight:400;opacity:.85;font-size:11px}
.sticker{max-width:130px;border-radius:8px;display:block;background:#1c2028}
.time{text-align:center;font-size:11px;color:#5b6373;margin:10px 0}
.moment{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:12px;border:1px solid var(--line)}
.mhead{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mtext{white-space:pre-wrap;word-break:break-word}
.mmeta{font-size:11px;color:#5b6373;margin-top:6px}
.replies{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.reply{font-size:12.5px;color:#c3c9d6;padding:2px 0}
.reply b{color:var(--accent);font-weight:600}
.empty{color:#5b6373;font-size:13px;text-align:center;padding:24px 0}
.livebox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.livenum{font-size:12px;color:#ff7a7a;margin-bottom:8px}
.dm{font-size:13px;padding:3px 0;color:#d8dde8}
.dm .who{color:var(--accent);font-weight:600}
.gift{color:#ffd666}
.rec{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rec button{background:#232936;border:1px solid #313a4a;color:#cfd6e4;padding:6px 10px;border-radius:14px;font-size:12px;cursor:pointer}
.rec button:active{background:#2d3648}
.plain{white-space:pre-wrap;font-size:13px;color:#cfd6e4}
.err{color:#ff7875;font-size:12px;padding:8px}
</style>

const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };

function ini(name){
  if(!name) return '?';
  return name.trim().slice(0,1);
}
function avatar(name, url){
  const d = el('div','ava');
  if(url){ const i = el('img'); i.src = url; i.onerror = ()=>{ d.textContent = ini(name); }; d.appendChild(i); }
  else d.textContent = ini(name);
  return d;
}

/* ---------- 解析 ---------- */
function parsePhone(text){
  const chat = [];      // 私聊与群聊
  const moments = [];   // 朋友圈
  const lives = [];     // 直播
  const friends = [];
  let seq = 0;

  const lines = text.split(/\r?\n/);
  let cur = null;       // 当前聊天窗口
  for(const raw of lines){
    const line = raw.trim();
    if(!line) continue;

    // [和X的聊天]
    let m = /^\[和(.+?)的聊天\]$/.exec(line);
    if(m){
      const title = m[1];
      const exist = chat.find(c=>c.title===title);
      if(exist){ cur = exist; }
      else { cur = {id:'c'+(seq++), title, kind:'chat', items:[]}; chat.push(cur); }
      continue;
    }
    // [对方消息|名字|id|类型|内容]
    m = /^\[对方消息\|([^|\]]*)\|([^|\]]*)\|([^|\]]*)\|(.*)\]$/s.exec(line);
    if(m){
      if(!cur){ cur = {id:'c'+(seq++), title:'私聊', kind:'chat', items:[]}; chat.push(cur); }
      cur.items.push({name:m[1], uid:m[2], type:m[3]||'文字', body:m[4]});
      continue;
    }
    // [群聊消息|群id|名字|类型|内容]
    m = /^\[群聊消息\|([^|\]]*)\|([^|\]]*)\|([^|\]]*)\|(.*)\]$/s.exec(line);
    if(m){
      if(!cur){ cur = {id:'c'+(seq++), title:'群聊', kind:'chat', items:[]}; chat.push(cur); }
      cur.items.push({gid:m[1], name:m[2], uid:m[1], type:m[3]||'文字', body:m[4]});
      continue;
    }
    // [好友id|名字|数字ID]
    m = /^\[好友id\|([^|\]]*)\|([^|\]]*)\]$/.exec(line);
    if(m){ friends.push({name:m[1], uid:m[2]}); continue; }
    // [群聊|名字|id|成员]
    m = /^\[群聊\|([^|\]]*)\|([^|\]]*)\|(.*)\]$/.exec(line);
    if(m){ friends.push({name:m[1], uid:m[2], members:m[3]}); continue; }
    // [朋友圈|名字|id|楼层|内容]
    m = /^\[朋友圈\|([^|\]]*)\|([^|\]]*)\|([^|\]]*)\|(.*)\]$/s.exec(line);
    if(m){ moments.push({name:m[1], uid:m[2], lid:m[3], body:m[4], replies:[]}); continue; }
    // [朋友圈回复|名字|id|楼层|内容]
    m = /^\[朋友圈回复\|([^|\]]*)\|([^|\]]*)\|([^|\]]*)\|(.*)\]$/s.exec(line);
    if(m){
      const t = moments.find(x=>x.lid===m[3]) || moments[moments.length-1];
      if(t) t.replies.push({name:m[1], body:m[4]});
      continue;
    }
    // [直播|...]
    m = /^\[直播\|([^|\]]*)\|([^|\]]*)\|(.*)\]$/s.exec(line);
    if(m){
      let L = lives[lives.length-1];
      if(!L){ L = {id:'l'+(seq++), num:'', content:'', dm:[], gifts:[], rec:[]}; lives.push(L); }
      const a=m[1], b=m[2], c=(m[3]||'').trim();
      if(a==='本场人数') L.num = b||c;
      else if(a==='直播内容'){ L.content = b || c; }
      else if(a==='推荐互动'){ L.rec.push(b||c); }
      else if(b==='弹幕'){ L.dm.push({who:a, text:c}); }
      else if(b==='打赏'){ L.gifts.push({who:a, text:c}); }
      else { L.dm.push({who:a, text:(b+' '+c).trim()}); }
      continue;
    }
  }
  return {chat, moments, lives, friends};
}

/* ---------- 渲染 ---------- */
function renderChat(c){
  const f = el('div','pane');
  const head = el('div','head');
  head.appendChild(el('span',null,c.title));
  head.appendChild(el('span',null,c.items.length+' 条'));
  f.appendChild(head);
  for(const it of c.items){
    const row = el('div','msg');
    row.appendChild(avatar(it.name));
    const b = el('div','body');
    b.appendChild(el('div','name', it.gid ? (it.name+' · 群'+it.gid) : (it.name+' · '+(it.uid||''))));
    const t = it.type;
    if(t==='表情包'){
      const img = el('img','sticker');
      img.src = it.body.trim();
      img.alt = STICKERS[img.src] || '表情';
      img.onerror = ()=>{ const s=el('div','bubble','[表情加载失败]'); img.replaceWith(s); };
      b.appendChild(img);
    } else if(t==='红包'){
      const r = el('div','redenv');
      r.appendChild(el('span',null,'🧧 红包'));
      r.appendChild(el('small',null,'¥'+it.body));
      b.appendChild(r);
    } else if(t==='语音'){
      const v = el('div','bubble voice');
      v.appendChild(el('span',null,'🔊'));
      const vp = String(it.body).split('|');
      const vtxt = vp[0] || '';
      const vdur = (vp[1]||'').replace(/[^0-9]/g,'');
      v.appendChild(el('span',null,vtxt));
      v.appendChild(el('span','dur',(vdur?vdur:Math.max(1,Math.round(vtxt.length/6)))+"''"));
      b.appendChild(v);
    } else {
      b.appendChild(el('div','bubble', it.body));
    }
    row.appendChild(b);
    f.appendChild(row);
  }
  return f;
}

function renderMoment(m){
  const d = el('div','moment');
  const h = el('div','mhead');
  h.appendChild(avatar(m.name));
  const hb = el('div'); hb.appendChild(el('div','name',m.name)); hb.appendChild(el('div','meta','ID '+m.uid));
  h.appendChild(hb);
  d.appendChild(h);
  d.appendChild(el('div','mtext', m.body));
  d.appendChild(el('div','mmeta','#'+m.lid));
  if(m.replies.length){
    const rp = el('div','replies');
    for(const r of m.replies){
      const line = el('div','reply');
      const b = el('b',null,r.name+'：');
      line.appendChild(b); line.appendChild(document.createTextNode(r.body));
      rp.appendChild(line);
    }
    d.appendChild(rp);
  }
  return d;
}

function renderLive(L){
  const d = el('div','livebox');
  d.appendChild(el('div','livenum','👁 在線 '+(L.num||'--')));
  if(L.content) d.appendChild(el('div','plain',L.content));
  if(L.dm.length){
    const box = el('div'); box.style.marginTop='10px';
    for(const x of L.dm){
      const p = el('div','dm');
      p.appendChild(el('span','who',x.who+'：'));
      p.appendChild(document.createTextNode(x.text));
      box.appendChild(p);
    }
    d.appendChild(box);
  }
  if(L.gifts.length){
    const box = el('div'); box.style.marginTop='8px';
    for(const x of L.gifts){
      const p = el('div','dm gift');
      p.appendChild(el('span','who',x.who+' 打赏 '));
      p.appendChild(document.createTextNode(x.text));
      box.appendChild(p);
    }
    d.appendChild(box);
  }
  if(L.rec.length){
    const r = el('div','rec');
    for(const t of L.rec){
      const btn = el('button',null,t);
      btn.onclick = ()=>{ post(t); };
      r.appendChild(btn);
    }
    d.appendChild(r);
  }
  return d;
}

async function post(text){
  try{
    const api = await window.ElecKoiReady;
    const ctx = await api.context.current();
    const input = api.input;
    const cur = input.get ? await input.get() : '';
    await input.set((cur ? cur+'\n' : '') + text);
  }catch(e){ /* 静默 */ }
}

function build(data){
  const tabs = document.getElementById('tabs');
  const panes = document.getElementById('panes');
  tabs.innerHTML=''; panes.innerHTML='';
  const all = [];
  for(const c of data.chat) all.push({label:c.title, kind:'chat', data:c});
  if(data.moments.length) all.push({label:'朋友圈', kind:'moment', data:data.moments});
  if(data.lives.length) all.push({label:'直播', kind:'live', data:data.lives});
  if(!all.length){ panes.innerHTML=''; panes.appendChild(el('div','empty','手机里暂时没有动静')); return; }

  all.forEach((t,i)=>{
    const tab = el('div','tab'+(i===0?' on':''), t.label);
    tab.onclick = ()=>{
      [...tabs.children].forEach(c=>c.classList.remove('on'));
      [...panes.children].forEach(c=>c.classList.remove('on'));
      tab.classList.add('on');
      panes.children[i].classList.add('on');
    };
    tabs.appendChild(tab);
    const p = el('div','pane'+(i===0?' on':''));
    if(t.kind==='chat') p.appendChild(renderChat(t.data));
    else if(t.kind==='moment'){ for(const m of t.data) p.appendChild(renderMoment(m)); }
    else { for(const L of t.data) p.appendChild(renderLive(L)); }
    panes.appendChild(p);
  });
}

/* ---------- 启动 ---------- */
(async ()=>{
  const tabs = document.getElementById('tabs');
  const panes = document.getElementById('panes');
  try{
    const api = await window.ElecKoiReady;
    const ctx = await api.context.current();
    let src = '';
    if(ctx && ctx.messageId){
      const msg = await api.messages.get(ctx.messageId);
      src = (msg && (msg.content || msg.displayContent)) || '';
    }
    if(!src){
      // 退回：直接读当前 DOM 里的 <Phone> 块
      const host = document.querySelector('[data-eleckoi-content]') || document.body;
      src = host.textContent || '';
    }
    const m = /<Phone>([\s\S]*?)<\/Phone>/i.exec(src);
    const inner = m ? m[1] : src;
    const data = parsePhone(inner);
    build(data);
  }catch(e){
    // 没有 SDK 时也尽量渲染：解析本页可见文本
    try{
      const m = /<Phone>([\s\S]*?)<\/Phone>/i.exec(document.body.textContent||'');
      if(m){ build(parsePhone(m[1])); }
      else { panes.innerHTML=''; const d=el('div','err'); d.textContent='手机数据读取失败：'+e.message; panes.appendChild(d); }
    }catch(e2){
      panes.innerHTML='';
      const d=el('div','err'); d.textContent='手机数据读取失败'; panes.appendChild(d);
    }
  }
})();
</script>
</body></html>
